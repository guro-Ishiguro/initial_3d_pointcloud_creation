# ============================================================================
# 視差推定パラメータ
# ============================================================================
WINDOW_SIZE: 7
MIN_DISP: 0
NUM_DISP: 16

# ============================================================================
# PatchMatch基本パラメータ
# ============================================================================
PATCHMATCH_ITERATIONS: 10
PATCHMATCH_PATCH_SIZE: 7
ZNCC_EPSILON: 1e-6
TOP_K_COSTS: 5
PATCHMATCH_DECAY_RATE: 0.95
PATCHMATCH_NORMAL_SEARCH_ANGLE: 60.0
ADAPTIVE_WEIGHT_SIGMA_COLOR: 10

# ============================================================================
# Coarse-to-Fine (Multi-Scale PatchMatch)
# ============================================================================
MULTI_SCALE_ENABLED: true
SCALES: [0.25, 0.5, 1.0]
ITERATIONS_PER_SCALE: [5, 5, 10]
SEARCH_RANGE_RATIOS: [1.0, 0.2, 0.05]

# ============================================================================
# フィルタリングパラメータ
# ============================================================================
FILTERING_COLOR_DIFFERENCE_THRESHOLD: 20
FILTERING_MIN_CONSISTENT_VIEWS: 3
GEOMETRIC_CONSISTENCY_ERROR_THRESHOLD: 0.05
GEOMETRIC_MIN_CONSISTENT_VIEWS: 2
MULTI_VIEW_VISIBILITY_THRESHOLD: 2
MULTI_VIEW_GEOMETRIC_ERROR_THRESHOLD: 0.05

# ============================================================================
# フレーム選択パラメータ
# ============================================================================
FRAME_STRIDE: 15
KEYFRAME_START_INDEX: null
KEYFRAME_END_INDEX: null

# ============================================================================
# 近傍ビュー選択パラメータ
# ============================================================================
MAX_NEIGHBORS: 8
NEIGHBOR_KEYFRAMES_EACH_SIDE: 5
NEIGHBOR_SELECTION_MODE: nearest
NEIGHBOR_NEAREST_COUNT: 10
NEIGHBOR_NEAREST_MIN_RADIUS_M: 0.0
NEIGHBOR_NEAREST_MAX_RADIUS_M: 1000000000.0

# ============================================================================
# ターゲット選択パラメータ
# ============================================================================
TARGET_INDICES: []

# ============================================================================
# 並列処理設定
# ============================================================================
MAX_WORKERS: 4

# ============================================================================
# デバッグ・出力設定
# ============================================================================
DEBUG_SAVE_DEPTH_MAPS: true
DEBUG_SAVE_NORMAL_MAPS: true

# ============================================================================
# 可視化パラメータ
# ============================================================================
SHOW_POINT_CLOUD: false
VIZ_CMAP: jet

# ============================================================================
# 保存・ログ設定
# ============================================================================
POSE_PLOT_PLANE: xz
POSE_PLOT_ARROW_STRIDE: 5
POSE_PLOT_ARROW_SCALE: 0.25

# ============================================================================
# バンドル調整設定
# ============================================================================
ENABLE_BUNDLE_ADJUSTMENT: false

# バンドル調整の最適化パラメータ
SFM_BA_ITERATIONS: 100              # 最適化の反復回数
SFM_BA_LEARNING_RATE: 0.001         # 学習率（推奨: 0.0001-0.01）
SFM_BA_HUBER_DELTA: 2.0             # Huber Lossのdelta（外れ値の閾値）
SFM_BA_SCHEDULER_FACTOR: 0.5        # 学習率スケジューラの減衰率
SFM_BA_SCHEDULER_PATIENCE: 10       # 学習率スケジューラのpatience（停滞許容回数）
SFM_BA_LOG_EVERY: 20                # ログ出力間隔（イテレーション数）

# 特徴点マッチングパラメータ
SFM_MAX_MATCHES: 2000               # 1ペアあたりの最大マッチ数
SFM_MAX_POINTS_PER_PAIR: 500        # 1ペアあたりの最大3D点数
SFM_MATCH_RATIO: 0.75               # 特徴点マッチングの比率閾値（Lowe's ratio test）

# ============================================================================
# エラースケール
# ============================================================================
POSITION_ERROR_SCALE: 0.0
ROTATION_ERROR_SCALE: 0.0
