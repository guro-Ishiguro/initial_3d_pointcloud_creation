## Camera settings used across the pipeline
## NOTE: Update values to match your dataset. These override dataset folder naming.

# Image resolution (pixels)
width: 1280
height: 720

# Stereo baseline length (meters)
B: 0.25

# Camera physical height from ground (meters)
camera_height: 50

# Field of view (degrees)
fov_h: 92.0
fov_v: 74.73365

# Optional intrinsics. If omitted, fx=fy is computed from fov_h and width; cx,cy default to width/2,height/2.
#fx: 2500.0
#fy: 2500.0
#cx: 1920.0
#cy: 1080.0
